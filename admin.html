<!doctype html><html lang="ar" dir="rtl"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1"><meta http-equiv="Content-Security-Policy" content="default-src 'self'; script-src 'self' https://www.gstatic.com; style-src 'self'; connect-src 'self' https://firestore.googleapis.com https://identitytoolkit.googleapis.com https://securetoken.googleapis.com https://www.googleapis.com; object-src 'none'; base-uri 'self'; form-action 'self'; upgrade-insecure-requests"><title>لوحة المصمم</title><link rel="stylesheet" href="style.css"><script type="module" src="admin.js"></script></head><body><header class="topbar"><a class="brand" href="index.html">۞ سُبْحَتِي</a><span>لوحة المصمم</span></header><main class="admin"><section class="panel"><h1>رسائل المصمم محمد</h1><p>سجّل الدخول بحساب المشرف الذي أنشأته في Firebase. لا يوجد إنشاء حسابات من هذه الصفحة.</p><form id="loginForm"><div class="field"><label for="email">البريد الإلكتروني</label><input id="email" type="email" autocomplete="username" required maxlength="254"></div><div class="field"><label for="password">كلمة المرور</label><input id="password" type="password" autocomplete="current-password" required maxlength="128"></div><button class="adminbtn">تسجيل الدخول</button></form><section id="editor" class="hidden"><div class="field"><label for="messageText">الرسالة العامة (240 حرفًا كحد أقصى)</label><textarea id="messageText" maxlength="240" placeholder="اكتب رسالتك..."></textarea></div><button id="publishButton" class="adminbtn">نشر الرسالة للجميع</button> <button id="logoutButton" class="adminbtn secondary">خروج</button></section><div id="status" class="status" role="status"></div><a class="back" href="index.html">← الرجوع للسبحة</a></section></main></body></html>
