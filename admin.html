
<!DOCTYPE html>
<html lang="ar" dir="rtl">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>تواصل معنا - سُبْحَتِي</title>

  <link rel="stylesheet"
    href="https://cdn.jsdelivr.net/npm/intl-tel-input@25.3.1/build/css/intlTelInput.css">

  <style>
    * {
      box-sizing: border-box;
    }

    body {
      margin: 0;
      min-height: 100vh;
      padding: 20px;
      display: flex;
      justify-content: center;
      align-items: center;
      font-family: Arial, sans-serif;
      background: linear-gradient(135deg, #062f35, #087e83);
      color: white;
    }

    .container {
      width: 100%;
      max-width: 480px;
      padding: 30px;
      border-radius: 20px;
      background: rgba(255,255,255,0.12);
      border: 1px solid rgba(255,255,255,0.2);
      box-shadow: 0 10px 35px rgba(0,0,0,0.25);
    }

    h1 {
      text-align: center;
      margin-top: 0;
    }

    .description {
      text-align: center;
      color: #d5eeee;
      margin-bottom: 25px;
    }

    label {
      display: block;
      margin: 16px 0 8px;
    }

    input, textarea {
      width: 100%;
      padding: 13px;
      border: 1px solid rgba(255,255,255,0.25);
      border-radius: 10px;
      background: rgba(255,255,255,0.12);
      color: white;
      font-size: 16px;
      outline: none;
    }

    input::placeholder,
    textarea::placeholder {
      color: #d5eeee;
    }

    textarea {
      min-height: 110px;
      resize: vertical;
    }

    .iti {
      width: 100%;
      direction: ltr;
    }

    .iti input {
      text-align: left;
      padding-left: 90px;
    }

    .iti__country-list {
      color: #222;
      direction: ltr;
    }

    #countryResult {
      margin-top: 10px;
      color: #d5eeee;
      font-size: 14px;
    }

    button, .home-btn {
      display: block;
      width: 100%;
      padding: 14px;
      margin-top: 18px;
      border: none;
      border-radius: 10px;
      text-align: center;
      text-decoration: none;
      font-size: 16px;
      font-weight: bold;
      cursor: pointer;
    }

    button {
      background: #20c997;
      color: #063b38;
    }

    button:disabled {
      opacity: 0.6;
      cursor: not-allowed;
    }

    .home-btn {
      background: white;
      color: #07575b;
    }

    .home-btn:hover {
      background: #d9eeee;
    }

    #statusMessage {
      text-align: center;
      margin-top: 12px;
      color: #d5eeee;
    }
  </style>
</head>

<body>

  <main class="container">

    <h1>تواصل معنا</h1>

    <p class="description">
      يسعدنا استقبال رسالتك عبر موقع سُبْحَتِي
    </p>

    <form id="contactForm">

      <label for="name">الاسم</label>
      <input
        type="text"
        id="name"
        name="name"
        placeholder="اكتب اسمك"
        required
      >

      <label for="phone">رقم الهاتف</label>
      <input
        type="tel"
        id="phone"
        name="phone"
        placeholder="رقم الهاتف"
        required
      >

      <div id="countryResult">
        الدولة: مصر
      </div>

      <label for="note">الرسالة أو الملاحظة</label>
      <textarea
        id="note"
        name="note"
        placeholder="اكتب رسالتك هنا"
      ></textarea>

      <button type="submit" id="submitBtn">
        إرسال
      </button>

      <div id="statusMessage"></div>

    </form>

    <a href="index.html" class="home-btn">
      العودة للصفحة الرئيسية
    </a>

  </main>

  <script src="https://cdn.jsdelivr.net/npm/intl-tel-input@25.3.1/build/js/intlTelInput.min.js"></script>

  <script>
    const phoneInput = document.getElementById("phone");
    const countryResult = document.getElementById("countryResult");
    const contactForm = document.getElementById("contactForm");

    const iti = window.intlTelInput(phoneInput, {
      initialCountry: "eg",
      separateDialCode: true,
      nationalMode: true,
      preferredCountries: ["eg", "sa", "ae", "us", "gb"],
      countrySearch: true,

      loadUtils: () =>
        import("https://cdn.jsdelivr.net/npm/intl-tel-input@25.3.1/build/js/utils.js")
    });

    function updateCountry() {
      const country = iti.getSelectedCountryData();

      countryResult.textContent =
        "الدولة: " + country.name +
        " | كود الدولة: +" + country.dialCode;
    }

    phoneInput.addEventListener("countrychange", updateCountry);

    updateCountry();

    // تجهيز الرقم قبل أن يستلمه contact.js
    contactForm.addEventListener("submit", function() {

      const country = iti.getSelectedCountryData();
      const digits = phoneInput.value.replace(/\D/g, "");

      if (!digits) return;

      let internationalNumber = "";

      try {
        internationalNumber = iti.getNumber();
      } catch (error) {
        internationalNumber = "";
      }

      // طريقة احتياطية إذا لم تحمل أدوات المكتبة
      if (!internationalNumber) {
        const nationalNumber = digits.replace(/^0+/, "");
        internationalNumber = "+" + country.dialCode + nationalNumber;
      }

      phoneInput.value = internationalNumber;

    }, true);
  </script>

  <script src="contact.js"></script>

</body>
</html>
