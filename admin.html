
<!DOCTYPE html>
<html lang="ar" dir="rtl">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>تواصل معنا | سُبْحَتِي</title>

  <style>
    * {
      margin: 0;
      padding: 0;
      box-sizing: border-box;
      font-family: Tahoma, Arial, sans-serif;
    }

    body {
      min-height: 100vh;
      display: flex;
      justify-content: center;
      align-items: center;
      padding: 20px;
      background: linear-gradient(135deg, #071c26, #064e50, #087f75);
      color: white;
    }

    .container {
      width: 100%;
      max-width: 500px;
      padding: 35px;
      background: rgba(255,255,255,0.09);
      border: 1px solid rgba(255,255,255,0.18);
      border-radius: 24px;
      backdrop-filter: blur(15px);
      box-shadow: 0 20px 50px rgba(0,0,0,0.3);
    }

    .logo {
      text-align: center;
      font-size: 38px;
      margin-bottom: 12px;
    }

    h1 {
      text-align: center;
      margin-bottom: 12px;
      font-size: 28px;
    }

    .description {
      text-align: center;
      color: #c5e5df;
      margin-bottom: 30px;
      line-height: 1.8;
    }

    label {
      display: block;
      margin-bottom: 9px;
      font-weight: bold;
    }

    input, textarea {
      width: 100%;
      padding: 15px;
      margin-bottom: 22px;
      border: 1px solid rgba(255,255,255,0.2);
      border-radius: 12px;
      background: rgba(0,0,0,0.2);
      color: white;
      font-size: 15px;
      outline: none;
    }

    input:focus, textarea:focus {
      border-color: #53e0c0;
    }

    input::placeholder, textarea::placeholder {
      color: #b7cfca;
    }

    textarea {
      min-height: 120px;
      resize: vertical;
    }

    button {
      width: 100%;
      padding: 16px;
      border: none;
      border-radius: 12px;
      background: linear-gradient(90deg, #20b99a, #42dfb9);
      color: #062c2a;
      font-size: 17px;
      font-weight: bold;
      cursor: pointer;
      transition: 0.3s;
    }

    button:hover {
      transform: translateY(-3px);
      box-shadow: 0 8px 20px rgba(32,185,154,0.3);
    }

    button:disabled {
      opacity: 0.6;
      cursor: not-allowed;
      transform: none;
    }

    footer {
      text-align: center;
      margin-top: 25px;
      color: #c5e5df;
      font-size: 13px;
    }
  </style>
</head>

<body>

  <main class="container">

    <div class="logo">📿</div>

    <h1>تواصل معنا</h1>

    <p class="description">
      أهلاً بك في سُبْحَتِي<br>
      يسعدنا استقبال رسالتك والرد عليك.
    </p>

    <form id="contactForm">

      <label for="name">الاسم بالكامل</label>
      <input
        type="text"
        id="name"
        name="name"
        placeholder="اكتب اسمك"
        required
        maxlength="100"
      >

      <label for="phone">رقم الهاتف</label>
      <input
        type="tel"
        id="phone"
        name="phone"
        placeholder="اكتب رقم هاتفك"
        required
        maxlength="20"
      >

      <label for="note">الملاحظة</label>
      <textarea
        id="note"
        name="note"
        placeholder="اكتب رسالتك هنا..."
        maxlength="1000"
      ></textarea>

      <button type="submit">إرسال الرسالة</button>

    </form>

    <footer>
      جميع الحقوق محفوظة © سُبْحَتِي
    </footer>

  </main>

  <script src="contact.js"></script>

</body>
</html>
